<!DOCTYPE html>
<html lang='pt-br'>

<head>
    <meta charset='UTF-8'>
    <title>STEAM Pro - Login</title>

    <link rel='stylesheet' href='https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css'>
    <link rel='stylesheet' href='css/login.css'>
</head>

<body class="bg-dark text-light">

<!-- TOPO -->
<nav class="navbar navbar-dark bg-black px-4">
    <span class="navbar-brand mb-0 h1">STEAM Pro</span>
</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card bg-black text-light border-secondary p-4">

                <h2 class="text-center mb-3">Login</h2>

                <div class="alert alert-secondary bg-dark text-light border-secondary small">
                    Insira seus dados para acessar sua conta.  
                    Use o email cadastrado e sua senha.
                </div>

                <form onsubmit='return login(event)'>

                    <div class='mb-3'>
                        <label class="form-label">Email</label>
                        <input type='email' class='form-control bg-dark text-light border-secondary'
                               id='email' placeholder='Digite seu email' required>
                    </div>

                    <div class='mb-3'>
                        <label class="form-label">Senha</label>
                        <input type='password' class='form-control bg-dark text-light border-secondary'
                               id='senha' placeholder='Digite sua senha' required>
                    </div>

                    <button class='btn btn-primary w-100'>
                        Entrar
                    </button>

                </form>

                <hr class="border-secondary">


            </div>

        </div>

    </div>

</div>

<script src='js/login.js'></script>

</body>
</html>
