<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Carrinho</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="css/carrinho.css">
</head>

<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-4">
  <span class="navbar-brand mb-0 h1">🛒 Seu Carrinho</span>
</nav>

<div class="container mt-4">

  <div class="row">

    <div class="col-lg-8">

      <div class="card bg-secondary text-light mb-3">
        <div class="card-body">
          <h5 class="card-title">Itens do carrinho</h5>
          <p class="card-text">Revise seus produtos antes de finalizar a compra.</p>
        </div>
      </div>

      <ul id="itens-carrinho" class="list-group mb-4"></ul>

    </div>

    <div class="col-lg-4">

      <div class="card bg-dark border-secondary text-light">
        <div class="card-body">

          <h5 class="card-title">Resumo da compra</h5>

          <hr>

          <div class="d-flex justify-content-between">
            <span>Subtotal</span>
            <span id="subtotal">R$ 0</span>
          </div>

          <div class="d-flex justify-content-between">
            <span>Descontos</span>
            <span>R$ 0</span>
          </div>

          <hr>

          <div class="d-flex justify-content-between fw-bold fs-5">
            <span>Total</span>
            <span id="total">R$ 0</span>
          </div>

          <button class="btn btn-primary w-100 mt-3">
            Finalizar compra
          </button>

        </div>
      </div>

    </div>

  </div>
</div>

<script src="js/carrinho.js"></script>
</body>
</html>
